name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.24.5, channel: stable, cache: true }
      - run: flutter create . --org com.thesync --project-name music --platforms=android
      - run: python3 tool/setup_android.py
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with: { name: Sync-musiC-apk, path: build/app/outputs/flutter-apk/app-release.apk }
